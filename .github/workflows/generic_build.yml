name: 'Build the DMS Container Image'

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: " define platforms"
        required: false
        type: string
        default: linux/amd64,linux/arm64
    outputs:
      build-cache-key:
        description: The cache key to use when restoring an image later
        value: ${{ jobs.build-image.outputs.build-cache-key }}
        default: linux/amd64

  workflow_call:
    inputs:
      platforms:
        required: false
        type: string
        default: linux/amd64


permissions:
  contents: read

# Tests run in a dependent job so a failed test suite does not prevent
# exporting the image cache. Useful when later commits reuse the same context.

jobs:
  build-image:
    name: 'Build'
    runs-on: ${{ inputs.platforms }}
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # GitHub cache keys MUST NOT contain commas. Sanitize `linux/amd64` and
      # `linux/amd64,linux/arm64` into `linux-amd64` / `linux-amd64-linux-arm64`.
      - name: 'Derive cache scope from platforms'
        id: cache-scope
        shell: bash
        run: echo "name=$(tr ',/' '--' <<< "${PLATFORMS}")" >>"${GITHUB_OUTPUT}"
        env:
          PLATFORMS: ${{ inputs.platforms }}

      # Native ARM64 runners do not need QEMU. AMD64-only builds skip it too.
      - name: 'Set up QEMU'
        if: contains(inputs.platforms, 'arm64') && runner.arch != 'ARM64'
        uses: docker/setup-qemu-action@v4.2.0
        with:
          platforms: arm64

      - name: 'Set up Docker Buildx'
        uses: docker/setup-buildx-action@v4.3.0

      - name: 'Build images'
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: ${{ inputs.platforms }}
          # Per-platform GHA scope. BuildKit matches at the layer level, so the
          # newest successful build overwrites the scope (no content-digest key).
          cache-from: type=gha,scope=${{ steps.cache-scope.outputs.name }}
          cache-to: type=gha,mode=max,scope=${{ steps.cache-scope.outputs.name }}
          # This job just builds the image and stores to cache, no other exporting required:
          # https://github.com/docker/build-push-action/issues/546#issuecomment-1122631106
          outputs: type=cacheonly
          # Disable provenance attestation: https://docs.docker.com/build/attestations/slsa-provenance/
          provenance: false
